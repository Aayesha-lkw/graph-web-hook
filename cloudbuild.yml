steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/wgs-mlops-sandbox/web-hook-repo/webhookgraphimgnew2:$SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/wgs-mlops-sandbox/web-hook-repo/webhookgraphimgnew2:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'webhookgraph'
      - '--image=europe-west1-docker.pkg.dev/wgs-mlops-sandbox/web-hook-repo/webhookgraphimgnew2:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--quiet'

images:
  - 'europe-west1-docker.pkg.dev/wgs-mlops-sandbox/web-hook-repo/webhookgraphimgnew2:$SHORT_SHA'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET