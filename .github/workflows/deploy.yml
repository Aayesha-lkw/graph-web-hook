name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t europe-west1-docker.pkg.dev/wgs-artifact-prod-tools/ml-platform/webhookgraphimgnew2:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push \
            europe-west1-docker.pkg.dev/wgs-artifact-prod-tools/ml-platform/webhookgraphimgnew2:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy webhookgraph \
            --image europe-west1-docker.pkg.dev/wgs-artifact-prod-tools/ml-platform/webhookgraphimgnew2:latest \
            --project wgs-mlops-sandbox \
            --region europe-west1 \
            --platform managed \
            --quiet
